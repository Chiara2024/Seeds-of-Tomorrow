<style>
    /* Contenitore principale delle card */
    .cards-section {
      display: flex;
      flex-wrap: wrap;              /* le card vanno a capo se non c'è più spazio */
      gap: 20px;                    /* distanza orizzontale/verticale tra le card */
      padding: 20px;
      justify-content: flex-start;  /* allinea le card a sinistra */
      align-items: flex-start;
      background-color: #F5F5F5;
      /* Se vuoi un'altezza fissa e uno scroll verticale:
         height: calc(100vh - 60px);
         overflow-y: auto;
      */
    }
  
    /* Stile di base per ogni card */
    .card {
      width: 200px;                /* larghezza fissa: puoi regolarla a piacere */
      border: 2px solid #333;      /* bordo nero/ scuro */
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      background-color: #fff;
      cursor: pointer;
      /* ombra leggera */
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  
    /* Immagine dentro la card */
    .card img {
      width: 100%;
      height: auto;                /* l’altezza si adatta all’immagine */
      display: block;
    }
  
    /* Titolo (nome pianta) */
    .card h3 {
      font-size: 1rem;
      margin: 10px 0 5px 0;        /* spazio sopra e sotto il titolo */
      color: #333;
    }
  
    /* Descrizione (interna alla card, visibile finché non si clicca) */
    .card p {
      font-size: 0.85rem;
      color: #666;
      margin: 0 10px 10px 10px;
    }
  </style>
  
  <!-- Sezione con tutte le card -->
  <div class="cards-section">
    
    <!-- Ogni card deve avere un data-plant univoco
         e conterrà l’immagine, il titolo e la descrizione -->
    
    <div class="card" data-plant="plant1">
      <img src="cisto.jpg" alt="Immagine Pianta 1">
      <h3>Cisto</h3>
      <p>Descrizione breve della pianta 1.</p>
    </div>
    
    <div class="card" data-plant="plant2">
      <img src="ammofila.jpg" alt="Immagine Pianta 2">
      <h3>Ammofila</h3>
      <p>Descrizione breve della pianta 2.</p>
    </div>
  
    <div class="card" data-plant="plant3">
      <img src="lentisco.jpg" alt="Immagine Pianta 3">
      <h3>lentisco</h3>
      <p>Descrizione breve della pianta 3.</p>
    </div>
    
    <!-- Aggiungi altre card se necessario -->
  </div>

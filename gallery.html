<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeds of Tomorrow - Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Stili per la sezione delle card */
    .cards-section {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      justify-content: center;  /* Centra le card su desktop */
      align-items: stretch;
      background-color: #F5F5F5;
      max-width: 1200px;
      margin: 60px auto 0;  /* margin-top per distanziare dalla navbar e centro il contenitore */
    }
    
    .card {
      display: flex;
      flex-direction: column;
      width: 300px;  /* Dimensione fissa per desktop */
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      background-color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    
    /* Rendiamo l'intera card cliccabile con un link */
    .card a {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    
    .card img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .card h3 {
      font-size: 1rem;
      margin: 10px 0 5px 0;
      color: #333;
    }
    
    .card p {
      font-size: 0.85rem;
      color: #666;
      margin: 0 10px 10px 10px;
    }
    
    /* Media query per dispositivi mobili */
    @media (max-width: 768px) {
      .cards-section {
        flex-direction: column;
        align-items: center;      /* Centra le card in modalità colonna */
        justify-content: center;
        width: 100%;
        margin: 60px auto 0;
      }
      .card {
        width: 90%;  /* Le card occupano il 90% della larghezza disponibile */
      }
    }
  </style>
</head>
<body>
  <div class="cards-section">
    <!-- Card 1 -->
    <div class="card">
      <a href="cisto.html">
        <img src="cisto.jpg" alt="Cisto">
        <h3>Cisto</h3>
        <p>Scopri di più sul Cisto.</p>
      </a>
    </div>
    <!-- Card 2 -->
    <div class="card">
      <a href="ammofila.html">
        <img src="ammofila.jpg" alt="Ammofila">
        <h3>Ammofila</h3>
        <p>Scopri di più sull' Ammofila.</p>
      </a>
    </div>
    <!-- Card 3 -->
    <div class="card">
      <a href="lentisco.html">
        <img src="lentisco.jpg" alt="Lentisco">
        <h3>Lentisco</h3>
        <p>Scopri di più sul Lentisco.</p>
      </a>
    </div>
  </div>
</body>
</html>
